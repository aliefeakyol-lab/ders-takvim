name: Ders Takvimini Güncelle

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sheets_to_ics.py'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python sheets_to_ics.py
      - run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/ders-programi.ics
          git diff --staged --quiet || git commit -m "🗓️ Takvim güncellendi ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
